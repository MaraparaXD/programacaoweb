<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Filmes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <header>
            <h1>Catálogo de Filmes</h1>
            <p>Prática: Objetos, JSON e localStorage</p>
        </header>

        <form id="form-filme">
            <label for="titulo">Título</label>
            <input type="text" id="titulo" required>

            <label for="genero">Gênero</label>
            <select id="genero" required>
                <option value="">Selecione...</option>
                <option>Ação</option>
                <option>Animação</option>
                <option>Comédia</option>
                <option>Drama</option>
                <option>Ficção científica</option>
                <option>Terror</option>
            </select>

            <div class="linha">
                <div>
                    <label for="ano">Ano</label>
                    <input type="number" id="ano" min="1888" max="2100" required>
                </div>
                <div>
                    <label for="nota">Nota (0 a 10)</label>
                    <input type="number" id="nota" min="0" max="10" step="0.5" required>
                </div>
            </div>

            <button type="submit">Adicionar filme</button>
        </form>

        <section>
            <div class="topo-lista">
                <h2>Filmes cadastrados (<span id="total">0</span>)</h2>
                <button type="button" id="btn-limpar" class="perigo">Limpar registros</button>
            </div>
            <ul id="lista"></ul>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
