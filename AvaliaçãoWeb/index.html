<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Catálogo interativo de produtos com busca, detalhes e favoritos.">
    <title>Vitrine — Catálogo de Produtos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="cabecalho">
        <div class="cabecalho__conteudo">
            <a href="index.html" class="logo">Vitrine<span>.</span></a>

            <form id="form-busca" class="busca" role="search">
                <label for="campo-busca" class="visualmente-oculto">Pesquisar produtos por nome</label>
                <input type="search" id="campo-busca" placeholder="Pesquisar (em inglês, ex.: phone, watch)" autocomplete="off">
                <button type="submit">Buscar</button>
            </form>

            <a href="#favoritos" class="atalho-favoritos">
                ♥ Favoritos <span id="contador-favoritos" class="contador">0</span>
            </a>
        </div>
    </header>

    <div class="layout">
        <main class="catalogo">
            <div class="catalogo__topo">
                <h1 id="titulo-catalogo">Todos os produtos</h1>
                <button type="button" id="btn-limpar-busca" class="botao-texto" hidden>Limpar busca</button>
            </div>

            <ul id="lista-produtos" class="grade"></ul>

            <!-- Mensagens de carregamento, erro e lista vazia (fica abaixo da lista
                 para aparecer perto do botão "Carregar mais") -->
            <div id="status" class="status" role="status" aria-live="polite"></div>

            <div class="paginacao">
                <button type="button" id="btn-mais" class="botao-secundario" hidden>Carregar mais</button>
            </div>
        </main>

        <aside id="favoritos" class="favoritos" aria-labelledby="titulo-favoritos">
            <div class="favoritos__topo">
                <h2 id="titulo-favoritos">Meus favoritos</h2>
                <button type="button" id="btn-limpar-favoritos" class="botao-texto" hidden>Limpar</button>
            </div>
            <p id="favoritos-vazio" class="favoritos__vazio">
                Você ainda não favoritou nenhum produto. Clique no ♡ de um produto para salvá-lo aqui.
            </p>
            <ul id="lista-favoritos" class="lista-favoritos"></ul>
        </aside>
    </div>

    <!-- Janela de detalhes do produto -->
    <dialog id="modal-detalhes" class="modal" aria-labelledby="detalhe-titulo">
        <button type="button" id="btn-fechar-modal" class="modal__fechar" aria-label="Fechar detalhes">×</button>
        <div id="conteudo-detalhes"></div>
    </dialog>

    <footer class="rodape">
        <p>Trabalho em Grupo 1 · Programação Web · Dados de <a href="https://dummyjson.com/docs/products" target="_blank" rel="noopener">DummyJSON</a></p>
    </footer>

    <script src="js/traducao.js"></script>
    <script src="js/api.js"></script>
    <script src="js/favoritos.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
